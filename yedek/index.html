<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Sora:wght@700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#fff;--fg:#14141a;--mut:#80808c;--card:#f1f1f5;--line:#e4e4ea;--ac:#6c5cff;--g:linear-gradient(135deg,#ff5fa2,#ffb35f 45%,#6c5cff);--fs:15px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d12;--fg:#f2f2f7;--card:#1b1b24;--line:#2a2a36;color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:500 var(--fs) Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

.rg{display:block;padding:2.5px;border-radius:50%;background:var(--g);width:fit-content;margin:0 auto 4px}.rg.none{background:var(--line)}.rg .av{border:2px solid var(--bg)}
.add{position:relative;display:block;width:fit-content;margin:0 auto 4px}.add i{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;border:2px solid var(--bg);font-style:normal;font-weight:800;font-size:14px;line-height:1}

.ic.f{fill:#ff3b6b;stroke:#ff3b6b}

.ri{position:absolute;left:12px;right:70px;bottom:14px;color:#fff;text-shadow:0 1px 3px #000}.ri b{cursor:pointer}

.sv{position:fixed;inset:0;background:#000;z-index:21;display:grid;place-items:center;color:#fff}

.sv .pgb i{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:pg 5s linear forwards}
.sv .sh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:10px;right:10px;display:flex;align-items:center;gap:8px}

.chm{background:var(--bg);width:min(100%,520px);border-radius:18px;padding:12px;animation:pop .25s}
.bw{width:min(100%,86vw,62vh);margin:10px auto}#bd{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 6px 20px #0004}
.q{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center}.q.l{background:#ebecd0}.q.d{background:#739552}
.q.lm{box-shadow:inset 0 0 0 100px #f6f66980}.q.s{box-shadow:inset 0 0 0 100px #7fc8ff90}.q.ck{background:radial-gradient(#f33,#f330 72%)}
.q u{width:30%;height:30%;border-radius:50%;background:#0003}.q u.cp{width:92%;height:92%;background:none;border:5px solid #0003}
.pc{position:absolute;width:12.5%;height:12.5%;display:grid;place-items:center;font-size:min(8.4vw,36px);pointer-events:none;transition:left .25s ease,top .25s ease;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif}
.pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 1px #000,0 1px 3px #0008}.pc.k{color:#111}
.gp{background:var(--card);border-radius:18px;padding:6px 14px;margin-bottom:14px}
.gp .gt{padding:10px 0 4px}.st2{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:10px}
.sw{width:48px;height:28px;border-radius:20px;background:var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on::after{left:23px}
.cdot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.cdot.on{border-color:var(--fg)}
.chip{background:var(--card);color:var(--fg);margin:3px 4px 3px 0;padding:8px 12px;font-weight:600}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:40;animation:pop .2s;max-width:90%;text-align:center}
.au{height:100%;overflow:auto;position:relative;display:grid;place-items:center}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}.orbs i{position:absolute;border-radius:50%;border:2px dashed var(--line);left:50%;top:26%;translate:-50% -50%;animation:sp 30s linear infinite}
.orbs i:nth-child(1){width:260px;height:260px}.orbs i:nth-child(2){width:420px;height:420px;animation-duration:50s;animation-direction:reverse}.orbs i:nth-child(3){width:640px;height:640px;animation-duration:80s}
.orbs i::after{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--g)}
.acn{position:relative;width:100%;max-width:420px;padding:24px;text-align:center}.fm{text-align:left;margin-top:14px;animation:fi .5s}
.lnk{background:none;color:var(--ac);padding:8px 0;font-weight:700}
.spin-s{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp .8s linear infinite;margin:30vh auto}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}@keyframes pop{from{opacity:0;transform:scale(.88) translateY(8px)}}
@keyframes bn{40%{transform:translateY(-4px)}}@keyframes pg{to{width:100%}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.07)}}
.nomo *,.nomo *::before,.nomo *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
"use strict";
/* Orbit: Kadraj'ın yedek uygulaması. Giriş ve veriler Supabase'te (kurulum: kurulum.sql), Spark videoları Cloudinary'de.
   Supabase adresi ve anon anahtarı ayar.js'te (Kadraj'ın acil modu da aynı dosyayı okur). */
const SUPA_URL = (window.SUPA || {}).url || "";
const SUPA_KEY = (window.SUPA || {}).key || "";
const CL = {cloud: "jw9koecu", preset: "Kadraj"};

/* ---------- yardımcılar ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LS = {get(k, d) {try {const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v)} catch {return d}}, set(k, v) {try {localStorage.setItem(k, JSON.stringify(v))} catch {}}, del(k) {try {localStorage.removeItem(k)} catch {}}};
const now = () => Date.now();
const ts = x => x ? new Date(x).getTime() : 0;
const imgOk = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s) ? s : "";
const vidOk = s => typeof s === "string" && /^https:\/\/res\.cloudinary\.com\//.test(s) ? s : "";
const ago = t => {const s = (now() - t) / 1000; return s < 60 ? "şimdi" : s < 3600 ? Math.floor(s / 60) + " dk" : s < 86400 ? Math.floor(s / 3600) + " sa" : Math.floor(s / 86400) + " g"};
function toast(x) {document.getElementById("toast")?.remove(); const d = document.createElement("div"); d.id = "toast"; d.textContent = x; document.body.append(d); setTimeout(() => d.remove(), 2600)}
function pick(accept) {return new Promise(res => {const i = document.createElement("input"); i.type = "file"; i.accept = accept; i.style.cssText = "position:fixed;left:-999px;opacity:0"; i.onchange = () => {res(i.files[0] || null); setTimeout(() => i.remove(), 500)}; document.body.append(i); i.click()})}
/* resmi küçültüp JPEG data adresine çevirir (en uzun kenar m, en çok lim karakter) */
function shrink(f, m, lim) {return new Promise((res, rej) => {const u = URL.createObjectURL(f), i = new Image(); i.onerror = () => {URL.revokeObjectURL(u); rej(new Error("Resim açılamadı"))};
 i.onload = () => {URL.revokeObjectURL(u); let k = Math.min(1, m / Math.max(i.width, i.height)); for (let n = 0; n < 6; n++) {const c = document.createElement("canvas"); c.width = Math.max(1, i.width * k | 0); c.height = Math.max(1, i.height * k | 0); c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
  for (let q = .82; q > .3; q -= .1) {const d = c.toDataURL("image/jpeg", q); if (d.length < lim) return res(d)} k *= .8} rej(new Error("Resim çok büyük"))}; i.src = u})}

/* ---------- ayarlar ---------- */
const CF = Object.assign({theme: "auto", ac: 0, fs: 15, mo: 1, seen: 1, typ: 1, ent: 1, act: 1}, LS.get("ob_cf", {}));
const ACC = [["#6c5cff", "linear-gradient(135deg,#ff5fa2,#ffb35f 45%,#6c5cff)"], ["#0ea5e9", "linear-gradient(135deg,#22d3ee,#0ea5e9 50%,#6366f1)"], ["#10b981", "linear-gradient(135deg,#a3e635,#10b981 50%,#0d9488)"], ["#f43f5e", "linear-gradient(135deg,#fbbf24,#f43f5e 55%,#a21caf)"]];
function applyCF() {const d = document.documentElement, a = ACC[CF.ac] || ACC[0]; d.style.setProperty("--ac", a[0]); d.style.setProperty("--g", a[1]); d.style.setProperty("--fs", CF.fs + "px"); d.classList.toggle("nomo", !CF.mo); if (CF.theme === "auto") delete d.dataset.theme; else d.dataset.theme = CF.theme}
const saveCF = () => {LS.set("ob_cf", CF); applyCF()};
applyCF();

/* ---------- ikonlar ---------- */
const IP = {home: "M3 11l9-8 9 8v10h-6v-6H9v6H3z", search: "M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5", plus: "M12 5v14M5 12h14", reel: "M4 4h16v16H4zM4 9h16M9 4l3 5M15 4l3 5M10 12l5 3-5 3z", user: "M12 4a4 4 0 100 8 4 4 0 000-8zM4 21a8 8 0 0116 0", send: "M22 3L2 11l7 3 3 7zM9 14l13-11", heart: "M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z", back: "M15 5l-7 7 7 7", menu: "M4 7h16M4 12h16M4 17h16", img: "M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9h.01", sun: "M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5", moon: "M20 14A8 8 0 1110 4a6 6 0 0010 10z", auto: "M12 3a9 9 0 100 18V3z", pawn: "M12 5a3 3 0 100 6 3 3 0 000-6zM9 21l1-8h4l1 8zM7 21h10", group: "M9 7a3 3 0 100 6 3 3 0 000-6zM3 20a6 6 0 0112 0M17 8a3 3 0 010 6M18 20a5 5 0 00-3-4.5", x: "M6 6l12 12M18 6L6 18", video: "M3 6h12v12H3zM15 10l6-3v10l-6-3", spark: "M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z", trash: "M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3", vol: "M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6", mute: "M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6", more: "M5 12h.01M12 12h.01M19 12h.01"};
const I = (n, s = 24, c = "") => `<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IP[n]}"/></svg>`;
const LOGO = (s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg${s}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5fa2"/><stop offset=".5" stop-color="#ffb35f"/><stop offset="1" stop-color="#6c5cff"/></linearGradient></defs><circle cx="16" cy="16" r="9.5" fill="none" stroke="url(#lg${s})" stroke-width="3.4"/><circle cx="25.5" cy="8" r="3.6" fill="url(#lg${s})"/></svg>`;

/* ---------- durum ---------- */
const S = {me: null, prof: null, P: {}, FO: [], ST: {}, C: {}, R: [], tab: "home", view: null, cur: null, msgs: [], seen: {}, typing: {}, game: null, online: new Set(), q: "", muted: true, rd: LS.get("ob_rd", {})};
const root = $("#app");
let sb = null, dbCh = null, onCh = null, chatCh = null;
const P = u => S.P[u] || {name: "?", un: "?"};
const av = (u, s = 40) => {const p = P(u); const h = imgOk(p.ph) ? `<img class="av" alt="" style="width:${s}px;height:${s}px" src="${p.ph}">` : `<div class="av" style="width:${s}px;height:${s}px;font-size:${s * .42}px;background:hsl(${[...String(u)].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 % 360},62%,52%)">${esc((p.name || "?")[0].toUpperCase())}</div>`;
 return `<span class="avw${CF.act && u !== S.me && S.online.has(u) && s >= 26 ? " on" : ""}">${h}</span>`};
const following = u => S.FO.filter(f => f.follower === u).map(f => f.followee);
const followers = u => S.FO.filter(f => f.followee === u).map(f => f.follower);
const iFollow = u => S.FO.some(f => f.follower === S.me && f.followee === u);
const storyOf = u => {const s = S.ST[u]; return s && now() - ts(s.created_at) < 864e5 ? s : null};
const chatOther = c => c.is_group ? null : (c.members || []).find(x => x !== S.me) || S.me;
