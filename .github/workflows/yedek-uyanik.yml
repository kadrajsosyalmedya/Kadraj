# Orbit (yedek/) için: Supabase'in ücretsiz projesi 7 gün kullanılmazsa uyutulur.
# Bu iş haftada iki kez veritabanına küçük bir istek atarak projeyi uyanık tutar.
# Adres ve anon anahtarı yedek/index.html'deki SUPA_URL / SUPA_KEY'den okunur (anon anahtar zaten sayfada herkese açık).
name: Orbit uyanık tut
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: yedek/index.html
          sparse-checkout-cone-mode: false
      - name: Supabase'e dokun
        run: |
          URL=$(grep -oP '^const SUPA_URL = "\K[^"]*' yedek/index.html || true)
          KEY=$(grep -oP '^const SUPA_KEY = "\K[^"]*' yedek/index.html || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Orbit henüz kurulmadı, atlandı."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
