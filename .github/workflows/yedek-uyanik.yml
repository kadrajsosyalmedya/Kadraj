# Orbit (yedek/) ve Kadraj'ın acil modu için: Supabase'in ücretsiz projesi 7 gün kullanılmazsa uyutulur.
# Bu iş haftada iki kez veritabanına küçük bir istek atarak projeyi uyanık tutar.
# Adres ve anon anahtarı yedek/ayar.js'ten okunur (anon anahtar zaten sayfada herkese açık).
name: Orbit uyanık tut
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: yedek/ayar.js
          sparse-checkout-cone-mode: false
      - name: Supabase'e dokun
        run: |
          URL=$(grep -oP '^\s*url: "\K[^"]*' yedek/ayar.js || true)
          KEY=$(grep -oP '^\s*key: "\K[^"]*' yedek/ayar.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Orbit henüz kurulmadı, atlandı."; exit 0; fi
          AUTH=""; case "$KEY" in eyJ*) AUTH="Authorization: Bearer $KEY";; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" ${AUTH:+-H "$AUTH"} -H "Content-Type: application/json" -d '{}'
          echo
