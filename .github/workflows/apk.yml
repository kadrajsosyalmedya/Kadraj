# Kadraj Android uygulaması (APK). GitHub derler; main dalında indirme bağlantısına koyar:
# https://github.com/kadrajsosyalmedya/Kadraj/releases/latest/download/kadraj.apk
# Uygulama siteyi açar (android-app/capacitor.config.json server.url), bu yüzden site güncellemeleri APK'sız gelir;
# APK yalnızca android-app/ değişince yeniden üretilir. Diğer dallarda yalnızca derleme denenir (indirme bağlantısı değişmez).
name: Kadraj APK
on:
  workflow_dispatch:
  push:
    paths: ["android-app/**", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Her derlemede aynı imza: imza anahtarı önbellekte saklanır (yoksa ilk derlemede oluşur). İmza değişirse eski uygulama kaldırılıp yenisi kurulmalı.
      - name: İmza anahtarı
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kadraj-imza-${{ github.ref_name }}-v1
      - name: Capacitor projesi
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          bash yama.sh
          npx cap sync android
      - name: Derle
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk kadraj.apk && ls -la kadraj.apk
      - name: Deneme dosyası (main dışı)
        if: github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: kadraj-apk-deneme
          path: kadraj.apk
      - name: İndirme bağlantısına koy (main)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kadraj-apk -y --cleanup-tag || true
          gh release create kadraj-apk kadraj.apk --title "Kadraj Android" --target "${{ github.sha }}" --latest --notes "Telefona indir ve kur. Kurulumda 'bilinmeyen kaynak' izni ve Play Protect uyarısı çıkabilir: Yine de yükle. Site güncellemeleri uygulamaya kendiliğinden gelir."
